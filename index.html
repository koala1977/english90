<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English 90">
<title>English 90 — 90 dni do swobodnej rozmowy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23231F1B'/%3E%3Ctext x='32' y='43' font-size='28' text-anchor='middle' fill='%23FAF7F2' font-family='Georgia,serif' font-weight='700'%3E90%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#FAF7F2;--surface:#FFFFFF;--surface2:#F3EEE6;--text:#1F1D1A;--muted:#7A7167;--line:#E8E1D6;
  --accent:#26221E;--accent-ink:#FAF7F2;--accent-soft:#EFE6DA;
  --brown:#6B513B;--brown-soft:#EFE6DA;--sand:#D7C4AE;
  --green:#486B44;--green-soft:#EAF1E8;--gold:#9B6B24;--gold-soft:#F7EFE0;--red:#A94438;--red-soft:#F9EAE8;
  --serif:"New York","Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(31,29,26,.03),0 4px 16px rgba(31,29,26,.035);
  --shadow-hover:0 6px 22px rgba(31,29,26,.07);
  --r:18px;color-scheme:light;
}
[data-theme=dark]{
  --bg:#161412;--surface:#201D1A;--surface2:#2A2622;--text:#F4EFE8;--muted:#A1988D;--line:#322D28;
  --accent:#F4EFE8;--accent-ink:#161412;--accent-soft:#312A23;
  --brown:#D4BCA2;--brown-soft:#2E2721;--sand:#5B4A3A;
  --green:#7FB07A;--green-soft:#1E2D1D;--gold:#E0AC5C;--gold-soft:#322716;--red:#E07A6E;--red-soft:#341E1C;
  --shadow:none;--shadow-hover:0 6px 20px rgba(0,0,0,.3);color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15.5px/1.55 var(--sans);
  padding-bottom:calc(78px + env(safe-area-inset-bottom));min-height:100vh;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.2;margin:0}
h1{font-family:var(--serif);font-weight:700;letter-spacing:-.02em}
h2{font-size:.98rem;font-weight:700;letter-spacing:-.01em}
a{color:var(--brown);text-underline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* layout */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:13px max(20px,calc((100vw - 840px)/2));
  padding-top:calc(13px + env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-weight:700;font-size:1.28rem;text-decoration:none;color:var(--text);letter-spacing:-.02em}
.brand span{color:var(--brown);font-style:italic}
.tabs{display:none;gap:4px;margin-left:auto}
.tabs a{color:var(--muted);text-decoration:none;font-weight:600;padding:7px 14px;border-radius:10px;font-size:.9rem;transition:background .15s,color .15s}
.tabs a:hover{color:var(--text);background:var(--surface2)}
.tabs a.on{background:var(--surface2);color:var(--text);font-weight:700}
.icon-btn{margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:1rem;display:grid;place-items:center;transition:background .15s,transform .1s}
.icon-btn:hover{background:var(--surface2)}
.icon-btn:active{transform:scale(.95)}

/* quiet minimalist bottom bar */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottombar a{flex:1;text-align:center;padding:9px 4px 8px;font-size:.7rem;font-weight:600;color:var(--muted);text-decoration:none;display:flex;flex-direction:column;gap:3px;align-items:center;transition:color .15s}
.bottombar a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.bottombar a.on{color:var(--text);font-weight:700}
body[data-view=train] .topbar,body[data-view=train] .bottombar,body[data-view=walk] .topbar,body[data-view=walk] .bottombar,body[data-view=vocab] .topbar,body[data-view=vocab] .bottombar,body[data-view=exam] .topbar,body[data-view=exam] .bottombar{display:none}
body[data-view=train],body[data-view=walk],body[data-view=vocab],body[data-view=exam]{padding-bottom:env(safe-area-inset-bottom)}
main{max-width:840px;margin:0 auto;padding:20px 18px 36px}
@media(min-width:720px){.tabs{display:flex}.bottombar{display:none}.icon-btn{margin-left:8px}body{padding-bottom:44px}main{padding-top:28px}}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.grid2{display:grid;gap:12px}
@media(min-width:600px){.grid2{grid-template-columns:1fr 1fr}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.hint{font-size:.82rem;color:var(--muted);margin:6px 0 0}

/* tactile button states (micro-interaction) */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer;
  transition:background .15s,border-color .15s,transform .08s,box-shadow .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--surface2);border-color:var(--sand)}
.btn:active{transform:translateY(1px) scale(.985)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--brown);border-color:var(--brown);color:#FAF7F2}
.btn.soft{background:var(--brown-soft);border-color:transparent;color:var(--brown)}
.btn.soft:hover{background:var(--sand);color:var(--text)}
.btn.danger{color:var(--red)}
.btn.big{min-height:54px;font-size:1rem;border-radius:14px;width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default;transform:none}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:650;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid transparent}
.chip.m1{background:var(--green-soft);color:var(--green)}.chip.m2{background:var(--brown-soft);color:var(--brown)}.chip.m3{background:var(--gold-soft);color:var(--gold)}
.chip.st-due{background:var(--gold-soft);color:var(--gold)}.chip.st-mature{background:var(--green-soft);color:var(--green)}
.chip.r-again{background:var(--red-soft);color:var(--red)}.chip.r-hard{background:var(--gold-soft);color:var(--gold)}.chip.r-good{background:var(--green-soft);color:var(--green)}.chip.r-easy{background:var(--brown-soft);color:var(--brown)}
.seg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.seg-grid{grid-template-columns:repeat(4,1fr)}}
.seg-tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 8px;border-radius:14px;border:1px solid var(--line);background:var(--bg);cursor:pointer;text-align:center;transition:transform .12s,border-color .15s,background .15s}
.seg-tile:hover{background:var(--surface);border-color:var(--sand);transform:translateY(-1px)}
.seg-tile:active{transform:scale(.98)}
.seg-tile b{font-family:var(--serif);font-size:1.45rem;line-height:1.1}
.seg-tile span{font-size:.74rem;color:var(--muted);font-weight:600}

/* progress bar with subtle diagonal texture (ref panel 03) */
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--brown),var(--brown) 6px,color-mix(in srgb,var(--brown) 82%,white) 6px,color-mix(in srgb,var(--brown) 82%,white) 12px);border-radius:99px;transition:width .4s ease}
.bar.green>i{background:var(--green)}

label.field{display:flex;flex-direction:column;gap:6px;font-size:.82rem;font-weight:650;color:var(--muted);min-width:0}
input[type=text],input[type=time],input[type=date],input[type=number],select,textarea{width:100%;max-width:100%;min-width:0;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:15.5px;color:var(--text);transition:border-color .15s}
input:hover,select:hover,textarea:hover{border-color:var(--sand)}
textarea{min-height:140px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;line-height:1.45}
input:focus,select:focus,textarea:focus,.btn:focus-visible,button:focus-visible{outline:2px solid var(--brown);outline-offset:2px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;font-weight:600;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--brown)}
.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
pre{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;font-size:13px;line-height:1.5;margin:0}
details>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:30px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"＋";color:var(--muted)}
details[open]>summary::after{content:"－"}
details[open]>summary{margin-bottom:14px}
.segmented{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.segmented button{border:0;background:transparent;padding:7px 13px;border-radius:9px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--muted);min-height:34px;transition:background .15s,color .15s}
.segmented button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* editorial dashboard hero */
.hero-ed{padding:4px 2px 6px}
.hero-eyebrow{font-size:.72rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.hero-title{font-family:var(--serif);font-size:clamp(2.1rem,6.5vw,2.9rem);line-height:1.06;font-weight:700;letter-spacing:-.025em}
.hero-title em{color:var(--brown);font-style:italic;font-weight:600}
.hero-lead{font-family:var(--serif);font-style:italic;color:var(--brown);font-size:1.05rem;margin:8px 0 0}
.hero-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:.86rem;color:var(--muted)}
.hero-meta b{color:var(--text)}

/* numbered minimalist action cards (ref 01-04 grid) */
.num-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.num-grid{grid-template-columns:1fr 1fr}.num-card.full{grid-column:1/-1}}
.num-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-width:0;
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.num-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--sand)}
.num-card:active{transform:translateY(0) scale(.99)}
.num-head{display:flex;align-items:center;gap:10px}
.num-badge{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:700;display:grid;place-items:center;flex-shrink:0;transition:box-shadow .2s ease}
.num-card.done-today .num-badge{box-shadow:0 0 0 2px var(--surface),0 0 0 4.5px var(--red)}
.num-card.next-up{border-color:var(--brown)}
.num-tag{margin-left:auto;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.num-tag.done{background:var(--red-soft);color:var(--red)}
.num-tag.next{background:var(--brown-soft);color:var(--brown)}
.nudge-bar{background:var(--surface);border:1px solid var(--sand);border-radius:14px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow)}
.nudge-bar .nudge-txt{font-size:.86rem;color:var(--text);line-height:1.35}
.nudge-bar .nudge-txt b{color:var(--brown)}
.num-title{font-weight:700;font-size:1rem;color:var(--text)}
.num-desc{font-size:.84rem;color:var(--muted);line-height:1.4}
.num-foot{margin-top:auto;padding-top:8px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:.8rem;color:var(--brown);font-weight:650}

/* minimalist 7-day strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 10px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;font-size:.74rem;color:var(--muted);font-weight:600;border:1px solid transparent}
.day .d-num{font-size:.88rem;font-weight:700;color:var(--text)}
.day .d-mark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.76rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.day.done .d-mark{background:var(--green-soft);color:var(--green);border:1px solid color-mix(in srgb,var(--green) 35%,transparent)}
.day.bonus .d-mark{background:var(--gold-soft);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.day.handicap .d-mark{background:var(--surface2);color:var(--muted)}
.day.missed .d-mark{background:var(--red-soft);color:var(--red)}
.day.today{background:var(--surface2);border-color:var(--sand)}
.day.today .d-mark{background:var(--accent);color:var(--accent-ink)}
.day.before{opacity:.4}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.stat-line{display:flex;justify-content:space-between;gap:10px;font-size:.86rem;margin-bottom:6px}
.stat-line b{font-weight:700}
.course-kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.course-kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--serif);font-size:1.35rem;line-height:1.1;color:var(--text)}
.kpi span{font-size:.73rem;color:var(--muted);font-weight:600}
.m-grid{display:grid;gap:10px}
@media(min-width:640px){.m-grid{grid-template-columns:repeat(3,1fr)}}
.m-box{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:8px}
.m-box.cur{background:var(--surface);border-color:var(--sand)}
.m-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.m-head b{font-size:.86rem}
.m-head span{font-size:.74rem;color:var(--muted);font-weight:650}
.m-sub{font-size:.74rem;color:var(--muted);line-height:1.3;min-height:2.5em}
.m-dots{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.m-dot{aspect-ratio:1;border-radius:4px;background:transparent;border:1px solid var(--line)}
.m-dot.done{background:var(--green);border-color:var(--green)}
.m-dot.past{background:var(--surface2);border-color:var(--surface2)}
.m-dot.today{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 2px var(--sand)}
.days-chips{display:flex;gap:6px;flex-wrap:wrap}
.days-chips button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:40px;height:38px;font-weight:650;font-size:.82rem;cursor:pointer;transition:background .15s}
.days-chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* focus views (train / walk / vocab) — calm editorial paper */
.focus{max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(16px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.focus-top{display:flex;align-items:center;gap:12px}
.focus-top .bar{flex:1}
.focus-top .count{font-weight:650;font-size:.86rem;min-width:48px;text-align:right;color:var(--muted)}
.flash{padding:26px 22px}
.sentence{font-family:var(--serif);font-size:clamp(1.45rem,5vw,1.95rem);line-height:1.38;font-weight:600;letter-spacing:-.01em;margin:14px 0 18px}
.sentence strong{color:var(--brown);font-weight:700;background:var(--brown-soft);border-radius:6px;padding:0 .22em}
.listen-row{display:flex;gap:10px;flex-wrap:wrap}
.listen-row .btn{flex:1;min-width:130px}
.btn.speaking{background:var(--brown-soft);border-color:var(--brown);color:var(--brown)}
.back-sec{display:flex;flex-direction:column;gap:14px;animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.translation{font-size:1.2rem;font-weight:650;line-height:1.4}
.expl{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:13px 15px;font-size:.94rem}
.expl b{color:var(--brown)}
.task{border:1px dashed var(--sand);background:var(--bg);border-radius:14px;padding:14px 16px}
.task h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--brown);margin-bottom:6px;font-weight:750}
.transcript{min-height:52px;margin-top:12px;padding:11px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:1.02rem}
.transcript.empty{color:var(--muted);font-size:.9rem}
.fb{margin-top:8px;font-weight:650;font-size:.92rem}
.fb.ok{color:var(--green)}.fb.warn{color:var(--gold)}
.btn.rec{background:var(--red);border-color:var(--red);color:#fff}
.rate{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-top:auto}
@media(min-width:560px){.rate{grid-template-columns:repeat(4,1fr)}}
.sticky-foot{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-top:auto}
.flash.tap{cursor:pointer;transition:border-color .15s,transform .1s}
.flash.tap:hover{border-color:var(--sand)}
.flash.tap:active{transform:scale(.995)}
.rate button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:650;padding:8px;transition:background .15s,border-color .15s,transform .08s}
.rate button:hover{background:var(--surface2);border-color:var(--sand)}
.rate button small{font-weight:500;color:var(--muted);font-size:.73rem}
.rate .again{color:var(--red)}.rate .hard{color:var(--gold)}.rate .good{color:var(--green)}.rate .easy{color:var(--brown)}
.rate button:active{transform:scale(.97)}
.center{text-align:center}
.celebrate{font-size:2.8rem;margin:6px 0}

/* walk */
.walk-card{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
.walk-card .sentence{font-size:clamp(1.55rem,5.8vw,2.2rem);margin:6px 0}
.walk-card .sentence.blur{filter:blur(9px);transition:filter .3s}
.walk-pl{color:var(--muted);font-size:1.05rem;min-height:1.6em}
.phase{font-size:1.15rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;min-height:2em;color:var(--brown)}
.phase .ph-ico{font-size:1.45rem}
.walk-ctl{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px}
.walk-ctl .btn{min-height:70px;font-size:1.6rem;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.05}
.walk-ctl .btn small{font-size:.68rem;font-weight:650;opacity:.72;letter-spacing:.02em}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sand);margin-right:6px}
.status-dot.on{background:var(--green)}

/* catalog */
.cat-item{display:flex;gap:12px;align-items:flex-start;padding:13px 4px;border-bottom:1px solid var(--line)}
.cat-item:last-child{border-bottom:0}
.cat-item .txt{flex:1;min-width:0}
.cat-item .en{font-weight:650;font-size:1rem}
.cat-item .en strong{color:var(--brown);background:var(--brown-soft);padding:0 4px;border-radius:4px}
.cat-item .pl{color:var(--muted);font-size:.9rem}
.cat-item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cat-actions{display:flex;gap:6px}
.pack-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pack-row:last-child{border-bottom:0}
.pack-row .ptxt{flex:1;min-width:200px}
.pack-row .ptitle{font-weight:700;font-size:.95rem}
.pack-row .pdesc{color:var(--muted);font-size:.82rem;margin-top:2px}
.filters{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.filters input{grid-column:1/-1}
@media(min-width:720px){.filters{grid-template-columns:2fr 1fr 1fr 1fr}.filters input{grid-column:auto}}
.form-grid{display:grid;gap:12px}
@media(min-width:720px){.form-grid{grid-template-columns:1fr 1fr}.form-grid .full{grid-column:1/-1}}

/* słówka */
.vcard{width:100%;min-height:220px;border-radius:20px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px 22px;cursor:pointer;text-align:center;transition:border-color .15s,transform .1s}
.vcard:hover{border-color:var(--sand)}
.vcard:active{transform:scale(.99)}
.vlabel{font-size:.7rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.vword{font-family:var(--serif);font-size:clamp(1.9rem,8vw,2.8rem);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.vans{font-family:var(--serif);font-size:clamp(1.5rem,6.5vw,2.15rem);font-weight:600;color:var(--brown);animation:rise .2s ease-out}
.vdiv{width:50%;border-top:1px dashed var(--sand);margin:4px 0}
.vq{display:flex;align-items:center;justify-content:center;gap:10px}
.opts{display:grid;gap:9px}
.opt{width:100%;text-align:left;min-height:56px;font-size:1.05rem;font-weight:600;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:11px 16px;cursor:pointer;display:flex;gap:12px;align-items:center;transition:background .12s,border-color .15s,transform .08s}
.opt:hover{background:var(--surface2);border-color:var(--sand)}
.opt:active{transform:scale(.99)}
.opt kbd{font:700 .76rem ui-monospace,Menlo,monospace;color:var(--muted);border:1px solid var(--line);border-radius:7px;width:24px;height:24px;display:grid;place-items:center;flex-shrink:0}
.opt.correct{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.opt[disabled]{cursor:default;opacity:1}
.opt.dim{opacity:.5}
.rate3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vfb{font-weight:700;font-size:1.05rem;text-align:center}
.vfb-banner{position:relative;overflow:hidden;border-radius:14px;padding:13px 16px;font-weight:700;font-size:1rem;text-align:center;animation:rise .18s ease-out;cursor:pointer}
.vfb-banner.ok{background:var(--green-soft);color:var(--green);border:1px solid color-mix(in srgb,var(--green) 45%,transparent)}
.vfb-banner.err{background:var(--red-soft);color:var(--red);border:1px solid color-mix(in srgb,var(--red) 45%,transparent)}
.vfb-banner .vfb-prog{position:absolute;left:0;bottom:0;height:3px;background:currentColor;opacity:.45;width:100%;transform-origin:left;animation:shrink var(--dur,700ms) linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.vcard.swiping{transition:none}
/* exam */
.exam-timer{height:4px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:-8px}
.exam-timer>i{display:block;height:100%;background:var(--brown);width:100%;transform-origin:left;transition:width .25s linear}
.exam-timer>i.low{background:var(--red)}
.exam-cloze{font-family:var(--serif);font-size:clamp(1.35rem,4.8vw,1.8rem);line-height:1.4;font-weight:600}
.exam-blank{display:inline-block;min-width:110px;border-bottom:2px solid var(--brown);color:var(--brown);padding:0 6px;margin:0 2px}
.exam-score{font-family:var(--serif);font-size:clamp(3.2rem,12vw,4.6rem);font-weight:700;line-height:1;letter-spacing:-.03em}
.exam-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.exam-row:last-child{border-bottom:0}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:12px;font-weight:600;font-size:.88rem;z-index:50;max-width:90vw;text-align:center;transition:.22s;box-shadow:0 8px 24px rgba(0,0,0,.14)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
'use strict';
/* =====================================================================
   English 90 — 90-dniowy plan nauki. Vanilla JS, zero zależności.
   Dane: localStorage ("english90.v1"). Mowa: Web Speech API.
   ===================================================================== */

/* ---------- 1. Baza kart (wbudowana) ---------------------------------
   en: zdanie z **pogrubionym zwrotem** | pl: tłumaczenie | phrasePl: krótkie znaczenie zwrotu */
const C = (month, n, en, phrasePl, pl, note, prompt) =>
  ({ id: `m${month}-${String(n).padStart(2, '0')}`, month, en, phrasePl, pl, note, prompt });

const BUILTIN_RAW = [
  /* Miesiąc 1 — podstawy i codzienne sytuacje */
  C(1, 1, "Excuse me, **where can I find** the nearest pharmacy?", "gdzie mogę znaleźć", "Przepraszam, gdzie mogę znaleźć najbliższą aptekę?",
    "Uniwersalny szkielet pytania o drogę lub rzecz w sklepie. Po „where can I find” dodajesz dowolny rzeczownik.",
    "Jesteś w obcym mieście. Zapytaj na głos o drogę do trzech miejsc (dworzec, bankomat, toaleta) — za każdym razem zacznij od „where can I find”."),
  C(1, 2, "I'd like to **grab a coffee** before work.", "szybko wypić kawę / wpaść na kawę", "Chciałbym wypić kawę przed pracą.",
    "„Grab” = szybko coś wziąć lub zjeść, bardzo naturalne w mowie: grab a bite, grab lunch, grab a drink.",
    "Powiedz, co chcesz szybko „grab” dziś po drodze: kawę, kanapkę albo coś do picia."),
  C(1, 3, "Sorry, I **didn't catch that**. Could you say it again?", "nie dosłyszałem / nie zrozumiałem", "Przepraszam, nie dosłyszałem. Możesz powtórzyć?",
    "Ratunek w rozmowie. Wariant: „Sorry, I didn't catch your name.” Bez wstydu proś o powtórzenie — native speakerzy robią to ciągle.",
    "Wyobraź sobie, że ktoś mówi do ciebie szybko. Zareaguj trzema różnymi sposobami, w tym raz z „didn't catch”."),
  C(1, 4, "**How long does it take** to get to the airport?", "ile to trwa", "Ile czasu zajmuje dojazd na lotnisko?",
    "Pytanie o czas trwania czegokolwiek: How long does it take to cook rice? To fix it? To get there?",
    "Zadaj głośno trzy pytania o czas: dojazd do pracy, ugotowanie obiadu, nauka gry na gitarze."),
  C(1, 5, "Do you **mind if I** sit here?", "czy ci przeszkadza, jeśli", "Czy nie masz nic przeciwko, żebym tu usiadł?",
    "Uwaga na odpowiedź: „No, go ahead” = nie przeszkadza, proszę. „Yes” zabrzmiałoby jak odmowa! Po „mind if I” czasownik w formie podstawowej.",
    "Jesteś w poczekalni. Zapytaj nieznajomego o zgodę na trzy sprawy (usiąść, otworzyć okno, podłączyć telefon) z „mind if I”."),
  C(1, 6, "I'm **looking for** a gift for my sister.", "szukam", "Szukam prezentu dla mojej siostry.",
    "W sklepie: „I'm looking for…” (konkretnie) lub „I'm just looking, thanks.” (tylko oglądam).",
    "Jesteś w sklepie. Powiedz sprzedawcy, czego szukasz — wymyśl dwie różne rzeczy."),
  C(1, 7, "Could you **give me a hand** with these bags?", "pomóc mi", "Mógłbyś mi pomóc z tymi torbami?",
    "Idiom „give someone a hand” = pomóc. Podobnie: lend a hand. Bardzo grzeczne i naturalne z „Could you…”.",
    "Poproś na głos o pomoc w trzech sytuacjach domowych (zakupy, przeprowadzka, komputer) używając „give me a hand”."),
  C(1, 8, "Sorry, I **gotta go** — I'll call you later.", "muszę lecieć", "Przepraszam, muszę lecieć — zadzwonię później.",
    "„Gotta” = got to, bardzo potocznie. Do pisania formalnego użyj „I have to go”. Świetne do kończenia rozmowy telefonicznej.",
    "Zakończ głośno wymyśloną rozmowę telefoniczną z „gotta go” i obiecaj, że oddzwonisz."),
  C(1, 9, "**What do you do** for a living?", "czym się zajmujesz zawodowo", "Czym się zajmujesz zawodowo?",
    "Stałe pytanie podczas small talku. Odpowiedź: „I work as a… / I'm a…”. Nie mów „What are you working?”.",
    "Zadaj pytanie „What do you do for a living?” do wyimaginowanej osoby, a potem odpowiedz sam o sobie."),
  C(1, 10, "**It's up to you** — I'm fine with anything.", "to zależy od ciebie / jak chcesz", "Jak chcesz — mnie pasuje wszystko.",
    "Oddajesz decyzję rozmówcy. Wariant: „It's up to you guys.” Przy wyborze restauracji brzmi bardzo naturalnie.",
    "Ktoś pyta, gdzie pójść na kolację. Odpowiedz, że to zależy od niego, i dodaj jedną własną sugestię."),
  C(1, 11, "Can you **speak a bit slower**, please?", "mówić trochę wolniej", "Możesz mówić trochę wolniej, proszę?",
    "„A bit” = trochę (łagodniej niż „slower!”). Dodaj „please” i uśmiech — rozmówca chętnie zwolni.",
    "Poproś głośno o wolniejsze tempo na trzy różne sposoby, w tym „speak a bit slower”."),
  C(1, 12, "I'm **running a little late**, so start without me.", "trochę się spóźniam", "Trochę się spóźnię, więc zaczynajcie beze mnie.",
    "„Running late” = jestem w drodze i się spóźniam. Naturalne w wiadomościach i telefonach: „I'm running 10 minutes late.”",
    "Zadzwoń (na niby) do znajomego i poinformuj go, że spóźnisz się o 15 minut. Podaj powód."),

  /* Miesiąc 2 — idiomy, phrasal verbs i kontekst */
  C(2, 1, "I **ran into** an old friend at the supermarket.", "wpadłem na / przypadkiem spotkałem", "Wpadłem na starego znajomego w supermarkecie.",
    "„Run into” = spotkać kogoś przypadkiem (też: bump into). Czasownik nieregularny: run – ran – run.",
    "Opowiedz głośno, kogo ostatnio niespodziewanie spotkałeś i gdzie, używając „ran into”."),
  C(2, 2, "We **ran out of** milk, so I need to go shopping.", "skończyło się nam", "Skończyło nam się mleko, więc muszę iść na zakupy.",
    "„Run out of + rzeczownik” = coś się skończyło. Niezbędne w domu i w pracy: We ran out of time / paper / ideas.",
    "Powiedz trzy rzeczy, które często ci się kończą (w domu, w pracy, w samochodzie), używając „run out of”."),
  C(2, 3, "Can you help me **figure out** how this app works?", "rozgryźć / ogarnąć", "Pomożesz mi ogarnąć, jak działa ta aplikacja?",
    "„Figure out” = zrozumieć, rozwiązać. Można rozdzielić: figure it out. Bardzo częsty phrasal verb.",
    "Opisz problem techniczny lub życiowy, który ostatnio musiałeś „figure out”. Jak to zrobiłeś?"),
  C(2, 4, "I'm trying to **cut down on** sugar.", "ograniczać", "Staram się ograniczać cukier.",
    "„Cut down on + rzecz” = jeść/robić mniej. Nie mylić z „cut out” (całkowicie wyeliminować).",
    "Powiedz, czego chcesz „cut down on” w nadchodzącym miesiącu i dlaczego."),
  C(2, 5, "Let's **catch up** over lunch this week.", "nadrobić zaległości (towarzyskie)", "Spotkajmy się na lunchu w tym tygodniu i pogadajmy.",
    "„Catch up” = pogadać po dłuższym czasie, opowiedzieć sobie, co nowego. „Catch up on” coś = nadrobić (catch up on sleep).",
    "Zaproponuj głośno koledze, z którym dawno nie rozmawiałeś, spotkanie na „catch up”. Podaj termin."),
  C(2, 6, "He **called off** the meeting at the last minute.", "odwołał", "Odwołał spotkanie w ostatniej chwili.",
    "„Call off” = odwołać (wydarzenie, plan). Synonim: cancel, ale „call off” brzmi bardziej potocznie.",
    "Opowiedz o planie, który kiedyś został „called off” — co się wydarzyło?"),
  C(2, 7, "I'll **get back to you** by Friday.", "odezwę się do ciebie", "Odezwę się do ciebie do piątku.",
    "Absolutny klasyk w pracy, gdy potrzebujesz czasu: „Let me check and get back to you.”",
    "Klient zadaje trudne pytanie. Odpowiedz, że sprawdzisz i „get back to” niego w konkretnym terminie."),
  C(2, 8, "It's **a piece of cake** once you get used to it.", "bułka z masłem", "To bułka z masłem, kiedy już się przyzwyczaisz.",
    "Idiom = coś bardzo łatwego. „Get used to” + -ing/rzeczownik = przyzwyczaić się.",
    "Powiedz o czymś, co na początku było trudne, a teraz to „a piece of cake”."),
  C(2, 9, "I'm **under the weather** today, so I'll stay home.", "kiepsko się czuję", "Kiepsko się dziś czuję, więc zostanę w domu.",
    "Idiom o lekkim niedomaganiu (przeziębienie, zmęczenie). Nie dotyczy poważnych chorób.",
    "Zadzwoń do szefa i powiedz, że źle się czujesz i nie przyjdziesz — użyj „under the weather”."),
  C(2, 10, "Don't worry, **it's not a big deal**.", "to nic wielkiego", "Nie martw się, to nic wielkiego.",
    "Pocieszenie i bagatelizowanie problemu. Odpowiedź na przeprosiny: „No worries / It's not a big deal.”",
    "Znajomy przeprasza, że zapomniał o twoim urodzinach. Uspokój go zdaniem z „not a big deal”."),
  C(2, 11, "I **couldn't make it** to the party last night.", "nie dałem rady przyjść", "Nie dałem rady przyjść wczoraj na imprezę.",
    "„Make it” = zdążyć, dotrzeć, dać radę być. „Can you make it on Friday?” = Czy dasz radę w piątek?",
    "Przeproś głośno za nieobecność na wydarzeniu, wyjaśnij krótko dlaczego, używając „couldn't make it”."),
  C(2, 12, "She **turned down** the job offer.", "odrzuciła", "Odrzuciła ofertę pracy.",
    "„Turn down” = odrzucić propozycję/ofertę (też zmniejszyć głośność!). Przeciwieństwo: accept.",
    "Opowiedz o ofercie lub zaproszeniu, które kiedyś „turned down” i dlaczego."),

  /* Miesiąc 3 — zaawansowane reagowanie i płynność */
  C(3, 1, "**That makes sense**, but have you considered the cost?", "to ma sens", "To ma sens, ale czy rozważyłeś koszt?",
    "Szybka reakcja pokazująca, że rozumiesz tok myśli rozmówcy. Wariant przeczący: „That doesn't make sense.”",
    "Wysłuchaj (w głowie) propozycji szefa i zareaguj: „That makes sense, but…” — dodaj własną wątpliwość."),
  C(3, 2, "**To be honest**, I'm not a big fan of horror movies.", "szczerze mówiąc", "Szczerze mówiąc, nie przepadam za horrorami.",
    "Wprowadza szczery lub lekko krytyczny komentarz. „Not a big fan of” = nie przepadam.",
    "Wyraź szczerą opinię o filmie, jedzeniu lub muzyce, zaczynając od „to be honest”."),
  C(3, 3, "**I see where you're coming from**, but I disagree.", "rozumiem twój punkt widzenia", "Rozumiem, skąd to bierzesz, ale się nie zgadzam.",
    "Grzeczny sposób na niezgodę: najpierw uznajesz stanowisko rozmówcy, potem „but…”.",
    "Zgłoś grzeczny sprzeciw wobec opinii, że „nauka angielskiego jest za trudna”, zaczynając od tego zwrotu."),
  C(3, 4, "**Come to think of it**, I did see him yesterday.", "jak się nad tym zastanowić", "Jak się nad tym zastanowić, widziałem go wczoraj.",
    "Używasz, gdy coś sobie nagle przypominasz w trakcie mówienia. Brzmi bardzo naturalnie i „native”.",
    "Ktoś pyta, czy widziałeś jego klucze. Odpowiedz „no”, a potem sobie przypomnij: „Come to think of it…”."),
  C(3, 5, "**It depends on** what you mean by “cheap”.", "to zależy od", "To zależy od tego, co rozumiesz przez „tanio”.",
    "„It depends on + rzeczownik / what…”. Często skracane do samego „It depends.” — dobra odpowiedź, gdy pytanie jest zbyt ogólne.",
    "Ktoś pyta: „Is learning English hard?”. Odpowiedz 3 zdaniami zaczynając od „It depends on…”."),
  C(3, 6, "**I couldn't agree more.**", "całkowicie się zgadzam", "Zupełnie się z tobą zgadzam.",
    "Idiom wzmacniający zgodę (dosłownie „nie mógłbym zgodzić się bardziej”). Wariant: „Absolutely” / „Totally”.",
    "Zareaguj z entuzjazmem na wypowiedź: „Warto wstawać wcześnie rano”. Użyj „couldn't agree more” i dodaj powód."),
  C(3, 7, "**Correct me if I'm wrong**, but didn't we already discuss this?", "popraw mnie, jeśli się mylę", "Popraw mnie, jeśli się mylę, ale czy już o tym nie rozmawialiśmy?",
    "Grzeczny sposób na zgłoszenie wątpliwości bez oskarżania. Przydatne na spotkaniach i w sporach.",
    "Zwróć głośno uwagę koledze na potencjalny błąd w planie, zaczynając od „correct me if I'm wrong”."),
  C(3, 8, "**Let me think about it** and I'll let you know tomorrow.", "daj mi to przemyśleć", "Daj mi to przemyśleć, a jutro dam ci znać.",
    "Kupuje czas bez odmowy. „Let me + czasownik” = pozwól, że… Dobre do negocjacji i zakupów.",
    "Sprzedawca proponuje ci droższy model. Grzecznie poproś o czas do namysłu i podaj, kiedy odpowiesz."),
  C(3, 9, "**What I mean is** we should start earlier.", "mam na myśli to, że", "Mam na myśli to, że powinniśmy zacząć wcześniej.",

function smartMergeState(local, inc) {

  if (src.startDate && (!out.startDate || src.startDate < out.startDate)) out.startDate = src.startDate;
  // 1. Postępy SRS — zachowaj nowszy wpis dla każdej karty/słówka
  for (const [id, sp] of Object.entries(src.progress)) {

    const sAt = sp.updatedAt || (sp.last ? Date.parse(sp.last) || 0 : 0);
    const lAt = lp.updatedAt || (lp.last ? Date.parse(lp.last) || 0 : 0);
    if (sAt > lAt || (sAt === lAt && (sp.reps || 0) + (sp.lapses || 0) > (lp.reps || 0) + (lp.lapses || 0))) {

      done: !!(ld.done || sd.done),
      classic: !!(ld.classic || sd.classic),
      walk: !!(ld.walk || sd.walk),
      vocab: !!(ld.vocab || sd.vocab),
      review: !!(ld.review || sd.review),
      exam: !!(ld.exam || sd.exam),
      reviews: Math.max(ld.reviews || 0, sd.reviews || 0),
      at: Math.min(ld.at || Infinity, sd.at || Infinity)
    };

    if (!wasDone && out.days[dt].done) daysAdded++;

  const cIds = new Set(out.custom.map(c => c.id));
  for (const c of src.custom) { if (c && c.id && !cIds.has(c.id)) { out.custom.push(c); cIds.add(c.id); itemsAdded++; } }
  const wIds = new Set(out.words.map(w => w.id));
  for (const w of src.words) { if (w && w.id && !wIds.has(w.id)) { out.words.push(w); wIds.add(w.id); itemsAdded++; } }

function schedule(prog, rating, failedBefore) {
  const p = prog ? { ...prog } : { ease: 2.5, interval: 0, reps: 0, lapses: 0, due: null };
  const t = today();
  p.last = t;
  p.lastRating = rating;
  p.updatedAt = Date.now();
  if (rating === 'again') {
    p.lapses++; p.ease = Math.max(1.3, p.ease - 0.2); p.reps = 0; p.interval = 0; p.due = t;
    return p;
  }
  let iv;
  if (failedBefore || p.reps === 0) {
    iv = rating === 'hard' ? 1 : rating === 'good' ? (failedBefore ? 1 : 2) : (failedBefore ? 2 : 4);
  } else if (rating === 'hard') {
    iv = Math.max(1, Math.round(p.interval * 1.2)); p.ease = Math.max(1.3, p.ease - 0.15);
  } else if (rating === 'good') {
    iv = Math.max(p.interval + 1, Math.round(p.interval * p.ease));
  } else {
    iv = Math.max(p.interval + 2, Math.round(p.interval * p.ease * 1.3)); p.ease = Math.min(3, p.ease + 0.15);
  }
  p.interval = Math.min(365, iv); p.reps++; p.due = addDays(t, p.interval);
  return p;
}

function buildDaily() {
  const t = today(), at = Number(state.settings.activeTopic) || 0;
  if (state.daily && state.daily.date === t && (state.daily.topic || 0) === at) return state.daily;
  const size = state.settings.sessionSize;
  const avail = availableCards();
  let ids;
  if (at === -1) {
    ids = avail.slice(0, size).map(c => c.id);
  } else {
    const due = avail.filter(c => state.progress[c.id] && state.progress[c.id].due <= t)
      .sort((a, b) => state.progress[a.id].due.localeCompare(state.progress[b.id].due)).slice(0, size);
    const slots = Math.max(0, size - due.length);
    const fresh = sortNew(avail.filter(c => !state.progress[c.id])).slice(0, Math.min(slots, state.settings.newPerDay));
    ids = due.concat(fresh).map(c => c.id);
  }
  state.daily = { date: t, topic: at, ids, queue: ids.slice(), completed: [], failed: [] };
  save();
  return state.daily;
}
function extendDaily(n = 5) {
  const d = buildDaily();
  const avail = availableCards().filter(c => !d.ids.includes(c.id));
  let pick = sortNew(avail.filter(c => !state.progress[c.id])).slice(0, n);
  if (pick.length < n) {
    const rest = avail.filter(c => state.progress[c.id])
      .sort((a, b) => state.progress[a.id].due.localeCompare(state.progress[b.id].due)).slice(0, n - pick.length);
    pick = pick.concat(rest);
  }
  pick.forEach(c => { d.ids.push(c.id); d.queue.push(c.id); });
  save();
  return pick.length;
}

/* ---------- 7. Tracker tygodnia + seria z handicapem ----------------- */
function weekInfo(ref) {
  const ws = weekStart(ref), t = today();
  let done = 0, missed = 0, left = 0;
  const days = [];
  for (let i = 0; i < 7; i++) {
    const date = addDays(ws, i);
    let status;
    if (date < state.startDate && !isDone(date)) status = 'before';
    else if (isDone(date)) { done++; status = done > WEEK_GOAL ? 'bonus' : 'done'; }
    else if (date < t) { missed++; status = missed <= HANDICAP ? 'handicap' : 'missed'; }
    else if (date === t) { status = 'today'; left++; }
    else { status = 'future'; left++; }
    days.push({ date, status });
  }
  return { days, done, missed, left };
}
function computeStreak() {
  const t = today();
  const doneDates = Object.keys(state.days).filter(isDone).sort();
  let from = state.startDate;
  if (doneDates.length && doneDates[0] < from) from = doneDates[0];
  let streak = 0, best = 0;
  const misses = {};
  for (let d = from; d <= t; d = addDays(d, 1)) {
    if (isDone(d)) { streak++; best = Math.max(best, streak); }
    else if (d < t) {
      const w = weekStart(d);
      misses[w] = (misses[w] || 0) + 1;
      if (misses[w] > HANDICAP) streak = 0;   // 3. opuszczony dzień w tygodniu zrywa serię
    }
  }
  return { streak, best };
}

function importCards(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { return { ok: false, error: 'Niepoprawny JSON: ' + e.message }; }
  let cardsIn = null, wordsIn = [];
  if (Array.isArray(data)) {
    cardsIn = data.filter(o => !(o && o.kind === 'word'));
    wordsIn = data.filter(o => o && o.kind === 'word');
  } else if (data && (Array.isArray(data.cards) || Array.isArray(data.words))) {
    cardsIn = Array.isArray(data.cards) ? data.cards : [];
    wordsIn = Array.isArray(data.words) ? data.words : [];
  }
  if (!cardsIn) return { ok: false, error: 'Oczekiwano tablicy lub obiektu {"cards": [...], "words": [...]}.' };
  let added = 0, updated = 0, wAdded = 0, wUpdated = 0;
  const errors = [];
  cardsIn.forEach((o, i) => {
    const errs = validateCard(o);
    if (errs.length) { errors.push(`karta #${i + 1}: ${errs.join('; ')}`); return; }
    const id = String(o.id || hashId(o.en));
    if (BUILTIN_IDS.has(id)) { errors.push(`karta #${i + 1}: id "${id}" jest zarezerwowane dla kart wbudowanych`); return; }
    const rec = {
      id, month: Number(o.month), topic: Number(o.topic) || 0, en: o.en.trim(), pl: o.pl.trim(),
      phrasePl: String(o.phrasePl || '').trim(), note: String(o.note || '').trim(), prompt: String(o.prompt || '').trim()
    };
    const idx = state.custom.findIndex(c => c.id === id);
    if (idx >= 0) { state.custom[idx] = rec; updated++; } else { state.custom.push(rec); added++; }
  });
  wordsIn.forEach((o, i) => {
    const errs = validateWord(o);
    if (errs.length) { errors.push(`słówko #${i + 1}: ${errs.join('; ')}`); return; }
    const id = String(o.id || 'w' + hashId(o.en.trim().toLowerCase() + '|' + o.pl.trim().toLowerCase()).slice(1));
    if (BUILTIN_WORD_IDS.has(id) || id.startsWith('p:')) { errors.push(`słówko #${i + 1}: id "${id}" jest zarezerwowane`); return; }
    const rec = { id, month: Number(o.month), topic: Number(o.topic) || 0, en: o.en.trim(), pl: o.pl.trim() };
    const idx = state.words.findIndex(c => c.id === id);
    if (idx >= 0) { state.words[idx] = rec; wUpdated++; } else { state.words.push(rec); wAdded++; }
  });
  save();
  return { ok: true, added, updated, wAdded, wUpdated, errors };
}

/* ---------- 8b. Słówka: pula, quiz, sesje ---------------------------- */
function vocabAll() {
  const words = BUILTIN_WORDS.concat(state.words.map(w => ({ id: w.id, month: Number(w.month), topic: Number(w.topic) || 0, en: w.en, pl: w.pl, kind: 'word', builtin: false })));
  const phrases = allCards().filter(c => c.phrase && c.phrasePl)
    .map(c => ({ id: 'p:' + c.id, month: c.month, topic: c.topic || 0, en: c.phrase, pl: c.phrasePl, kind: 'phrase', builtin: c.builtin }));
  return words.concat(phrases);
}
function vocabAvailable() {
  const at = Number(state.settings.activeTopic) || 0;
  if (at === -1) return vocabAll().filter(x => isProblem(x.id)).sort((a, b) => problemScore(b.id) - problemScore(a.id));
  if (at > 0) return vocabAll().filter(x => x.topic === at);
  const m = currentMonth(), un = state.settings.unlockAll;
  return vocabAll().filter(x => un || x.month <= m);
}
function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}
function pickVocabSession(size) {
  const t = today(), av = vocabAvailable(), P = state.progress;
  const due = av.filter(x => P[x.id] && P[x.id].due <= t).sort((a, b) => P[a.id].due.localeCompare(P[b.id].due)).slice(0, size);
  const used = new Set(due.map(x => x.id));
  const fresh = shuffle(av.filter(x => !P[x.id] && !used.has(x.id))).sort((a, b) => a.month - b.month).slice(0, size - due.length);
  fresh.forEach(x => used.add(x.id));
  let picked = due.concat(fresh);
  if (picked.length < size) {   // za mało nowych/zaległych — dobierz do ćwiczenia z pozostałych
    picked = picked.concat(shuffle(av.filter(x => !used.has(x.id))).slice(0, size - picked.length));
  }
  return shuffle(picked);
}
function quizOptions(item, dir) {
  const key = dir === 'en-pl' ? 'pl' : 'en';
  const correct = item[key];
  const seen = new Set([correct.toLowerCase()]);
  const opts = [correct];
  const avail = vocabAvailable(), rest = vocabAll();
  for (const x of shuffle(avail).concat(shuffle(rest))) {
    if (x.id === item.id) continue;
    const k = x[key].toLowerCase();
    if (seen.has(k)) continue;
    seen.add(k); opts.push(x[key]);
    if (opts.length === 4) break;
  }
  return shuffle(opts);
}

/* ---------- 8c. Tryb Egzamin: pula, generator pytań, sprawdzanie ----- */
function examScopeLabel(sc) {
  if (sc === 'learned') return 'Wszystkie poznane';
  if (sc === 'avail') return 'Wszystkie odblokowane';
  if (sc === 'm1') return 'Miesiąc 1: ' + MONTHS[1];
  if (sc === 'm2') return 'Miesiąc 2: ' + MONTHS[2];
  if (sc === 'm3') return 'Miesiąc 3: ' + MONTHS[3];
  if (sc && sc.startsWith('t')) { const t = topicById(sc.slice(1)); return t ? `Blok ${t.id}: ${t.title}` : 'Wybrany blok'; }
  return 'Wszystkie odblokowane';
}
function examPool(sc) {
  const m = currentMonth(), un = state.settings.unlockAll;
  let cards = allCards(), voc = vocabAll();
  if (sc === 'learned') {
    cards = cards.filter(c => state.progress[c.id]);
    voc = voc.filter(v => state.progress[v.id]);
  } else if (sc === 'm1' || sc === 'm2' || sc === 'm3') {
    const mm = Number(sc[1]);
    cards = cards.filter(c => c.month === mm);
    voc = voc.filter(v => v.month === mm);
  } else if (sc && sc.startsWith('t')) {
    const tid = Number(sc.slice(1));
    cards = cards.filter(c => c.topic === tid);
    voc = voc.filter(v => v.topic === tid);
  } else {
    cards = cards.filter(c => un || c.month <= m);
    voc = voc.filter(v => un || v.month <= m);
  }
  return { cards, voc };
}
function normAnswer(s) {
  return String(s || '').toLowerCase().replace(/[’‘`]/g, "'").replace(/[^a-z0-9'\s]/g, ' ').replace(/\s+/g, ' ').trim();
}
function checkTypedAnswer(input, expected) {
  const a = normAnswer(input), b = normAnswer(expected);
  if (!a || !b) return false;
  if (a === b) return true;
  if (b.startsWith('to ') && a === b.slice(3)) return true;
  if (a.startsWith('to ') && a.slice(3) === b) return true;
  return false;
}
function makeDistractors(correct, poolVals) {
  const seen = new Set([correct.toLowerCase()]);
  const opts = [correct];
  for (const val of shuffle(poolVals)) {
    const k = val.toLowerCase();
    if (seen.has(k)) continue;
    seen.add(k); opts.push(val);
    if (opts.length === 4) break;
  }
  return shuffle(opts);
}
function buildExamQuestions(sc, count) {
  const { cards, voc } = examPool(sc);
  const allEn = vocabAll().map(v => v.en), allPl = vocabAll().map(v => v.pl);
  const cardPhrases = allCards().map(c => c.phrase).filter(Boolean);
  const qs = [], usedEn = new Set();
  const sCards = shuffle(cards.filter(c => c.phrase && c.pl));
  const sVoc = shuffle(voc);

  // ok. 30% pytań: uzupełnianie luki w zdaniu (cloze)
  const clozeTarget = Math.min(sCards.length, Math.max(1, Math.round(count * 0.3)));
  for (const c of sCards) {
    if (qs.length >= clozeTarget) break;
    const key = c.phrase.toLowerCase();
    if (usedEn.has(key)) continue;
    usedEn.add(key);
    qs.push({
      type: 'cloze', itemId: c.id, en: c.phrase, pl: c.phrasePl || c.pl,
      sentence: c.en, sentencePl: c.pl, speakText: plain(c.en),
      answer: c.phrase, opts: makeDistractors(c.phrase, cardPhrases.concat(allEn))
    });
  }
  // pozostałe: miks słuch (listen), PL->EN (pl-en) oraz wpisz odpowiedź (type)
  let slot = 0;
  for (const v of sVoc) {
    if (qs.length >= count) break;
    const key = v.en.toLowerCase();
    if (usedEn.has(key)) continue;
    usedEn.add(key);
    const canType = v.en.length <= 22 && !/[\/()]/.test(v.en);
    let type;
    if (slot % 4 === 0 && canType) type = 'type';
    else if (slot % 2 === 0) type = 'listen';
    else type = 'pl-en';
    slot++;
    if (type === 'listen') {
      qs.push({ type: 'listen', itemId: v.id, en: v.en, pl: v.pl, speakText: v.en, answer: v.pl, opts: makeDistractors(v.pl, allPl) });
    } else if (type === 'pl-en') {
      qs.push({ type: 'pl-en', itemId: v.id, en: v.en, pl: v.pl, speakText: v.en, answer: v.en, opts: makeDistractors(v.en, allEn) });
    } else {
      qs.push({ type: 'type', itemId: v.id, en: v.en, pl: v.pl, speakText: v.en, answer: v.en, opts: [] });
    }
  }
  return shuffle(qs);
}

/* ---------- 9. Dopasowanie wypowiedzi do zwrotu ---------------------- */
function normWords(s) {
  return String(s).toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9'\s]/g, ' ').split(/\s+/).filter(Boolean);
}
function phraseMatch(transcript, phrase) {
  const tw = normWords(transcript), pw = normWords(phrase);
  const hit = w => tw.some(x => x === w || (w.length >= 4 && x.length >= 4 && x.slice(0, 4) === w.slice(0, 4)));
  const missing = pw.filter(w => !hit(w));
  return { all: pw.length > 0 && missing.length === 0, missing, words: tw.length };
}

/* ---------- 10. Przypomnienia: .ics + Notification ------------------- */
const ICS_DAYS = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
function buildICS(time, days, fromDate) {
  const [hh, mm] = time.split(':');
  let first = fromDate;
  for (let i = 0; i < 7 && !days.includes(parseD(first).getDay()); i++) first = addDays(first, 1);
  const n = nowFn();
  const stamp = `${n.getUTCFullYear()}${pad2(n.getUTCMonth() + 1)}${pad2(n.getUTCDate())}T${pad2(n.getUTCHours())}${pad2(n.getUTCMinutes())}${pad2(n.getUTCSeconds())}Z`;
  const byday = days.slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(d => ICS_DAYS[d]).join(',');
  return [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//English90//PL//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    `UID:english90-${stamp}-${hh}${mm}@local`,
    `DTSTAMP:${stamp}`,
    `DTSTART:${first.replace(/-/g, '')}T${hh}${mm}00`,
    'DURATION:PT20M',
    `RRULE:FREQ=WEEKLY;BYDAY=${byday};COUNT=${days.length * 13}`,
    'SUMMARY:English 90 — trening (15–20 min)',
    'DESCRIPTION:Dzienna sesja: fiszki lub tryb spacerowy. Cel: 5 z 7 dni w tygodniu.',
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Czas na trening angielskiego', 'TRIGGER:PT0M', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n') + '\r\n';
}
function reminderDue(nowDate) {
  const s = state.settings;
  if (!s.remindEnabled) return false;
  const t = dstr(nowDate);
  if (state.meta.lastNotified === t || isDone(t)) return false;
  if (!s.remindDays.includes(nowDate.getDay())) return false;
  const [hh, mm] = s.remindTime.split(':').map(Number);
  const mins = nowDate.getHours() * 60 + nowDate.getMinutes();
  const target = hh * 60 + mm;
  return mins >= target && mins < target + 30;
}

const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Mowa: TTS ---------- */
const hasTTS = hasDOM && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
const SR = hasDOM ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;
const speakResolvers = new Set();
const normLang = v => v.lang.replace('_', '-');
function pickVoice(lang) {
  if (!hasTTS) return null;
  const vs = speechSynthesis.getVoices();
  if (!vs.length) return null;
  if (lang.startsWith('en') && state.settings.voiceName) {
    const v = vs.find(x => x.name === state.settings.voiceName);
    if (v) return v;
  }
  let c = vs.filter(v => normLang(v) === lang);
  if (!c.length) c = vs.filter(v => normLang(v).toLowerCase().startsWith(lang.slice(0, 2).toLowerCase()));
  if (!c.length) return null;
  const score = v => (/premium|enhanced/i.test(v.name + v.voiceURI) ? 3 : 0) + (/google|samantha|daniel|karen|serena|zosia|ewa|agnieszka/i.test(v.name) ? 1 : 0) + (v.localService ? 0.5 : 0);
  return c.sort((a, b) => score(b) - score(a))[0];
}
function speak(text, { lang = 'en-US', rate = 1 } = {}) {
  return new Promise(res => {
    if (!hasTTS) { toast('Ta przeglądarka nie obsługuje syntezy mowy'); return res(false); }
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(lang);
    u.lang = v ? normLang(v) : lang; if (v) u.voice = v;
    u.rate = rate;
    let finished = false;
    const fin = ok => { if (finished) return; finished = true; clearTimeout(timer); speakResolvers.delete(fin); res(ok); };
    const timer = setTimeout(() => fin(true), Math.max(3000, text.length * 120 / rate + 2500)); // zabezpieczenie (iOS)
    u.onend = () => fin(true); u.onerror = () => fin(false);
    speakResolvers.add(fin);
    try { speechSynthesis.resume(); } catch (e) { /* ignore */ }
    speechSynthesis.speak(u);
  });
}
function cancelSpeech() {
  if (hasTTS) try { speechSynthesis.cancel(); } catch (e) { /* ignore */ }
  [...speakResolvers].forEach(f => f(false));
}
const wait = ms => new Promise(r => setTimeout(r, ms));
async function say(text, opts) { cancelSpeech(); await wait(60); return speak(text, opts); }

/* =====================  TRENING KLASYCZNY  ===================== */
const T = { rev: false, rec: null, timer: null, results: { again: 0, hard: 0, good: 0, easy: 0 } };
function clearTrainTimer() { if (T.timer) { clearTimeout(T.timer); T.timer = null; } }

VIEWS.train = function viewTrain() {
  const d = buildDaily();
  clearTrainTimer();
  T.rev = false; T.results = { again: 0, hard: 0, good: 0, easy: 0 };
  mainEl().innerHTML = '<section class="focus" id="trainRoot"></section>';
  drawTrain();
  if (state.settings.autoplay && d.queue.length) setTimeout(speakSentence, 250);
};
function drawTrain() {
  const root = $('#trainRoot'); if (!root) return;
  const d = state.daily;
  const total = d.ids.length, doneN = d.completed.length;
  const top = `<div class="focus-top"><button class="btn sm" data-act="home" aria-label="Wróć do dashboardu">←</button>
      ${bar(total ? doneN / total * 100 : 0, 'green')}<span class="count">${doneN}/${total}</span></div>`;

  if (!d.queue.length) {
    const r = T.results, any = r.again + r.hard + r.good + r.easy;
    root.innerHTML = top + (total ? `
      <div class="card center" style="margin:auto 0">
        <div class="celebrate">🎉</div>
        <h1>Sesja ukończona!</h1>
        <p class="muted">Przerobione karty: ${total}${any ? ` · Dobrze/Łatwe: ${r.good + r.easy} · Trudne: ${r.hard} · Nie pamiętam: ${r.again}` : ''}</p>
        <div class="stack" style="margin-top:20px">
          <button class="btn primary big" data-act="start-walk">🎧 Odsłuchaj w Trybie Spacerowym</button>
          <button class="btn big" data-act="extend">➕ Dodatkowa runda (+5 kart)</button>
          <button class="btn" data-act="home">Wróć do dashboardu</button>
        </div>
      </div>` : `
      <div class="card center" style="margin:auto 0">
        <div class="celebrate">✨</div>
        <h1>Brak kart na dziś</h1>
        <p class="muted">Wszystko przerobione. Dodaj kolejne karty w katalogu lub zrób dodatkową rundę.</p>
        <div class="stack" style="margin-top:20px">
          <button class="btn primary big" data-act="extend">➕ Dodatkowa runda (+5 kart)</button>
          <a class="btn" href="#/catalog" style="text-decoration:none;text-align:center;display:block">Otwórz Katalog / Edytor</a>
        </div>
      </div>`);
    return;
  }
  const c = cardById(d.queue[0]);
  if (!c) { d.queue.shift(); save(); return drawTrain(); }
  const failed = d.failed.includes(c.id);
  const prog = state.progress[c.id];
  const pv = r => r === 'again' ? 'za chwilę' : fmtInterval(schedule(prog, r, failed).interval);
  const rate = state.settings.rate;

  root.innerHTML = top + `
    <div class="card flash ${T.rev ? '' : 'tap'}" ${T.rev ? '' : 'data-act="card-tap"'}>
      <div class="row between"><span class="chip m${c.month}">Miesiąc ${c.month}</span>${failed ? '<span class="chip st-due">powtórka</span>' : (!T.rev ? '<span class="small muted">Stuknij kartę, aby sprawdzić</span>' : '')}</div>
      <div class="sentence" lang="en">${md(c.en)}</div>
      <div class="listen-row">
        <button class="btn" id="listenBtn" data-act="listen">🔊 Posłuchaj</button>
        <button class="btn" data-act="rate-toggle" aria-label="Prędkość odtwarzania">Tempo: ${rate === 1 ? '1.0×' : '0.75×'}</button>
      </div>
    </div>
    ${T.rev ? `
    <div class="back-sec">
      <div class="card stack" style="gap:14px">
        <div class="translation">${esc(c.pl)}</div>
        <div class="expl"><b>${esc(c.phrase)}</b>${c.phrasePl ? ` — ${esc(c.phrasePl)}` : ''}${c.note ? `<br><span class="muted">${esc(c.note)}</span>` : ''}</div>
        <div class="task">
          <h3>Zadanie — powiedz na głos</h3>
          <div>${esc(c.prompt || `Ułóż własne zdanie z użyciem „${c.phrase}” i powiedz je na głos.`)}</div>
          <div class="row" style="margin-top:12px">
            ${SR ? `<button class="btn ${T.rec ? 'rec' : 'soft'}" id="micBtn" data-act="mic">${T.rec ? '⏹ Słucham… (stuknij, by zakończyć)' : '🎤 Mów'}</button>` : ''}
            ${SR ? '' : '<span class="small muted">Mikrofon przeglądarki wymaga Chrome/Safari (na iPhonie przez https://) — użyj dyktowania 🎤 z klawiatury poniżej.</span>'}
          </div>
          <form id="spokenForm" class="row" style="margin-top:10px;flex-wrap:nowrap">
            <input id="spokenInput" type="text" lang="en" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Podyktuj z klawiatury (🎤) lub wpisz zdanie…" style="flex:1;min-width:0">
            <button type="submit" class="btn sm">Sprawdź</button>
          </form>
          <div class="transcript empty" id="transcript" aria-live="polite">Tu pojawi się transkrypcja Twojej wypowiedzi…</div>
          <div class="fb" id="fb"></div>
        </div>
      </div>
    </div>
    <div class="rate" role="group" aria-label="Oceń przypomnienie">
      <button class="again" data-act="rate" data-r="again">Nie pamiętam<small>${pv('again')}</small></button>
      <button class="hard" data-act="rate" data-r="hard">Trudne<small>${pv('hard')}</small></button>
      <button class="good" data-act="rate" data-r="good">Dobrze<small>${pv('good')}</small></button>
      <button class="easy" data-act="rate" data-r="easy">Łatwe<small>${pv('easy')}</small></button>
    </div>` : `
    <div class="sticky-foot"><button class="btn primary big" data-act="reveal">Sprawdź</button></div>`}
    <p class="hint center">Skróty: Spacja — sprawdź · L — odsłuch · M — mikrofon · 1–4 — ocena</p>`;
}
function speakSentence() {
  const d = state.daily; if (!d || !d.queue.length || currentView !== 'train') return;
  const c = cardById(d.queue[0]); if (!c) return;
  const btn = $('#listenBtn'); if (btn) btn.classList.add('speaking');
  say(plain(c.en), { lang: accent(), rate: state.settings.rate }).then(() => { const b = $('#listenBtn'); if (b) b.classList.remove('speaking'); });
}
function reveal() { T.rev = true; drawTrain(); window.scrollTo({ top: 0 }); }
function rateCard(r) {
  clearTrainTimer();
  const d = state.daily, id = d.queue[0]; if (!id || !T.rev) return;
  const failed = d.failed.includes(id);
  state.progress[id] = schedule(state.progress[id], r, failed);
  const day = state.days[today()] || (state.days[today()] = {});
  day.reviews = (day.reviews || 0) + 1;
  d.queue.shift();
  T.results[r]++;
  if (r === 'again') {
    if (!failed) d.failed.push(id);
    d.queue.splice(Math.min(3, d.queue.length), 0, id);
  } else if (!d.completed.includes(id)) d.completed.push(id);
  stopMic(); cancelSpeech(); T.rev = false;
  if (!d.queue.length) {
    markDone('classic');
    if (Number(state.settings.activeTopic) === -1) markDone('review');
  }
  save(); drawTrain(); window.scrollTo({ top: 0 });
  if (state.settings.autoplay && d.queue.length) setTimeout(speakSentence, 250);
}
function stopMic() { if (T.rec) { try { T.rec.stop(); } catch (e) { /* ignore */ } } T.rec = null; }
function evalSpoken(txt, c) {
  const tEl = $('#transcript'), fbEl = $('#fb');
  if (tEl) { tEl.textContent = txt; tEl.classList.remove('empty'); }
  if (!fbEl) return;
  const m = phraseMatch(txt, c.phrase);
  if (m.all) {
    playFx('ok');
    fbEl.className = 'fb ok';
    if (state.settings.autoAdvance) {
      fbEl.innerHTML = `✓ Świetnie! Użyłeś zwrotu „${esc(c.phrase)}” — przechodzę dalej… <button class="btn sm" data-act="train-hold" style="margin-left:8px">Zatrzymaj</button>`;
      clearTrainTimer();
      const cardId = c.id;
      T.timer = setTimeout(() => { T.timer = null; if (currentView === 'train' && T.rev && state.daily && state.daily.queue[0] === cardId) rateCard('good'); }, 1400);
    } else {
      fbEl.textContent = `✓ Użyłeś zwrotu „${c.phrase}”. Świetnie!`;
    }
  } else if (m.words < normWords(c.phrase).length + 2) {
    fbEl.className = 'fb warn';
    fbEl.textContent = 'Spróbuj powiedzieć pełne zdanie ze zwrotem.';
  } else {
    fbEl.className = 'fb warn';
    fbEl.textContent = `Nie wykryłem: ${m.missing.join(', ')}. Spróbuj jeszcze raz — wyraźnie i z tym zwrotem.`;
  }
}
function toggleMic() {
  if (!SR) { toast('Użyj dyktowania 🎤 z klawiatury w polu poniżej'); return; }
  if (T.rec) { T.rec.stop(); return; }
  const c = cardById(state.daily.queue[0]); if (!c) return;
  cancelSpeech();
  const r = new SR();
  r.lang = accent(); r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
  const tEl = () => $('#transcript'), fbEl = () => $('#fb');
  r.onresult = e => {
    let txt = '';
    for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
    if (tEl()) { tEl().textContent = txt; tEl().classList.remove('empty'); }
    if (e.results[e.results.length - 1].isFinal) evalSpoken(txt, c);
  };
  r.onerror = e => {
    const msg = {
      'not-allowed': 'Brak zgody na mikrofon — zezwól w ustawieniach przeglądarki.',
      'service-not-allowed': 'Rozpoznawanie mowy zablokowane przez system (na Macu włącz Dyktowanie w Ustawieniach systemowych → Klawiatura).',
      'no-speech': 'Nic nie usłyszałem — spróbuj ponownie.',
      'audio-capture': 'Nie znaleziono mikrofonu.',
      'network': 'Ta przeglądarka nie ma dostępu do usługi rozpoznawania mowy (użyj Google Chrome lub Safari, albo podyktuj/wpisz zdanie w polu poniżej).'
    }[e.error] || 'Błąd rozpoznawania mowy: ' + e.error;
    if (fbEl()) { fbEl().className = 'fb warn'; fbEl().textContent = msg; }
  };
  r.onend = () => { T.rec = null; const b = $('#micBtn'); if (b) { b.className = 'btn soft'; b.textContent = '🎤 Mów jeszcze raz'; } };
  T.rec = r;
  try { r.start(); } catch (e) { T.rec = null; toast('Nie udało się uruchomić mikrofonu'); return; }
  const b = $('#micBtn'); if (b) { b.className = 'btn rec'; b.textContent = '⏹ Słucham… (stuknij, by zakończyć)'; }
  if (tEl()) { tEl().textContent = 'Mów teraz…'; tEl().classList.add('empty'); }
  if (fbEl()) { fbEl().textContent = ''; fbEl().className = 'fb'; }
}

const walk = { ids: [], idx: 0, started: false, running: false, finished: false, token: 0, phase: '' };
const walkResolvers = new Set();
let wakeLock = null, actx = null;
const PHASES = {
  listen: ['🎧', 'Słuchaj zdania'], gap: ['⏳', 'Chwila…'], phrase: ['🐢', 'Zwrot — wolniej'],
  pl: ['🇵🇱', 'Znaczenie'], shadow: ['🗣️', 'Powtórz na głos!'], paused: ['⏸', 'Pauza']
};
function wsleep(ms) {
  return new Promise(res => {
    const t = setTimeout(() => { walkResolvers.delete(r); res(true); }, ms);
    const r = () => { clearTimeout(t); walkResolvers.delete(r); res(false); };
    walkResolvers.add(r);
  });
}
function beep() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 880; g.gain.value = 0.07; o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 0.12);
  } catch (e) { /* ignore */ }
}
function playFx(kind) {
  if (!hasDOM || !state.settings.soundFx) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    const tone = (freq, start, dur, vol) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, t + start);
      g.gain.exponentialRampToValueAtTime(0.001, t + start + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t + start); o.stop(t + start + dur);
    };
    if (kind === 'ok') { tone(587.3, 0, 0.11, 0.07); tone(880, 0.09, 0.16, 0.07); }
    else if (kind === 'err') { tone(240, 0, 0.18, 0.06); }
  } catch (e) { /* ignore */ }
}

  paintWake();
}
function releaseWake() { try { if (wakeLock) wakeLock.release(); } catch (e) { /* ignore */ } wakeLock = null; }
function paintWake() {
  const el = $('#wakeStatus'); if (!el) return;
  const ok = !!wakeLock && !wakeLock.released;
  el.innerHTML = `<span class="status-dot ${ok ? 'on' : ''}"></span>${'wakeLock' in navigator ? (ok ? 'Ekran nie zgaśnie' : 'Blokada ekranu nieaktywna') : 'Brak blokady wygaszania w tej przeglądarce'}`;
}
function setPhase(p) {

  const b = $('#walkBar');

    b.style.transition = 'none'; b.style.width = '0%';
    const dur = p === 'shadow' ? SHADOW_MS : p === 'gap' ? GAP_MS : 0;
    if (dur) { void b.offsetWidth; b.style.transition = `width ${dur}ms linear`; b.style.width = '100%'; }
  }
  const plEl = $('#walkPl'); if (plEl) plEl.style.visibility = (p === 'pl' || p === 'shadow' || p === 'paused') ? 'visible' : 'hidden';
  const sEl = $('#walkSentence'); if (sEl && state.settings.walkHideText) sEl.classList.toggle('blur', p === 'listen' || p === 'gap');
  if (p === 'shadow') beep();
}
function walkHalt() {
  walk.token++; walk.running = false;
  [...walkResolvers].forEach(f => f());
  releaseWake();
}
async function walkPlayCard(token) {
  const c = cardById(walk.ids[walk.idx]); if (!c) return true;
  const ok = () => token === walk.token;
  setPhase('listen');
  await wait(150); if (!ok()) return false;   // chroni przed gubieniem mowy tuż po cancel()
  await speak(plain(c.en), { lang: accent(), rate: 1 }); if (!ok()) return false;
  setPhase('gap'); await wsleep(GAP_MS); if (!ok()) return false;
  setPhase('phrase');
  await speak(c.phrase, { lang: accent(), rate: 0.8 }); if (!ok()) return false;
  if (state.settings.walkPl) {
    setPhase('pl'); await wait(250); if (!ok()) return false;

  }

}
async function walkLoop() {

    const done = await walkPlayCard(token);
    if (!done || token !== walk.token) return;
    walk.idx++;
    if (walk.idx < walk.ids.length) drawWalk();

function bindVocabSwipe() {
  const el = $('#vFlipCard'); if (!el) return;
  let sx = 0, sy = 0, dx = 0, active = false;
  el.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; active = true;
    el.classList.add('swiping');
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (!active) return;
    const x = e.touches[0].clientX - sx, y = e.touches[0].clientY - sy;
    if (Math.abs(y) > Math.abs(x) && Math.abs(dx) < 12) { active = false; el.classList.remove('swiping'); el.style.transform = ''; return; }
    dx = x;
    el.style.transform = `translateX(${clamp(dx, -120, 120)}px) rotate(${clamp(dx / 25, -5, 5)}deg)`;
  }, { passive: true });
  el.addEventListener('touchend', () => {
    if (!active) return;
    active = false; el.classList.remove('swiping'); el.style.transform = '';
    if (dx > 65) { playFx('ok'); toast('✓ Znam'); vocabRate('good'); }
    else if (dx < -65) { playFx('err'); toast('↻ Do powtórki'); vocabRate('again'); }

const E = { phase: 'setup', qs: [], idx: 0, answers: [], startedAt: 0, answered: false, ok: false, given: '', advTimer: null, tickTimer: null, leftMs: 0, secs: 0 };
function clearExamTimers() {

};
function startExam() {
  clearExamTimers();
  const s = state.settings;
  const qs = buildExamQuestions(s.examScope, s.examSize);
  if (qs.length < 4) return toast('Za mało materiału w wybranym zakresie (min. 4 pozycje). Wybierz szerszy zakres lub załaduj bloki.');
  E.qs = qs; E.idx = 0; E.answers = []; E.startedAt = Date.now(); E.phase = 'play';
  loadExamQ();
}
function loadExamQ() {
  clearExamTimers(); cancelSpeech();
  if (E.idx >= E.qs.length) return finishExam();
  E.answered = false; E.ok = false; E.given = '';
  const q = E.qs[E.idx];
  const limit = Number(state.settings.examTimer) || 0;
  E.leftMs = limit * 1000;
  drawExam();
  if (q.type === 'listen') setTimeout(() => say(q.speakText, { lang: accent(), rate: state.settings.rate }), 200);
  if (q.type === 'type') setTimeout(() => { const inp = $('#examInput'); if (inp) inp.focus(); }, 60);
  if (limit > 0) {
    const endAt = Date.now() + limit * 1000;
    E.tickTimer = setInterval(() => {
      E.leftMs = Math.max(0, endAt - Date.now());
      const barEl = $('#examTimerBar');
      if (barEl) {
        const pct = (E.leftMs / (limit * 1000)) * 100;
        barEl.style.width = pct + '%';
        barEl.classList.toggle('low', pct < 30);
      }
      if (E.leftMs <= 0) submitExamAnswer('', true);
    }, 150);
  }
}
function submitExamAnswer(val, timedOut = false) {
  if (E.answered || E.phase !== 'play') return;
  clearExamTimers();
  const q = E.qs[E.idx];
  const ok = !timedOut && (q.type === 'type' ? checkTypedAnswer(val, q.answer) : val === q.answer);
  E.answered = true; E.ok = ok; E.given = timedOut ? '(czas minął)' : val;
  E.answers.push({ q, ok, given: E.given });
  playFx(ok ? 'ok' : 'err');
  if (q.type !== 'listen' || !ok) say(q.speakText, { lang: accent(), rate: state.settings.rate });
  drawExam();
  if (ok && state.settings.autoAdvance) {
    const idxNow = E.idx;
    E.advTimer = setTimeout(() => {
      E.advTimer = null;
      if (currentView === 'exam' && E.phase === 'play' && E.idx === idxNow && E.answered) { E.idx++; loadExamQ(); }
    }, 800);
  }
}
function finishExam() {
  clearExamTimers();
  E.phase = 'end';
  E.secs = Math.max(1, Math.round((Date.now() - E.startedAt) / 1000));
  const score = E.answers.filter(a => a.ok).length;
  const total = E.answers.length;
  const pct = total ? Math.round(score / total * 100) : 0;
  const passed = pct >= 80;
  // Zapisz błędy w SRS jako 'again' -> trafią do Powtórek trudnych; poprawne wzmocnij jako 'good'
  for (const a of E.answers) {
    const id = a.q.itemId;
    if (!id) continue;
    state.progress[id] = schedule(state.progress[id], a.ok ? 'good' : 'again', !a.ok);
  }
  state.exams.push({ date: today(), scope: examScopeLabel(state.settings.examScope), score, total, pct, passed, secs: E.secs });
  if (state.exams.length > 20) state.exams = state.exams.slice(-20);
  if (total >= 10) markDone('exam');
  save();
  drawExam();
}

function showImportReport(r) {

}

function setSetting(el) {
  const k = el.dataset.set;
  let v = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value;
  if (k === 'startDate') { if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return; state.startDate = v; state.daily = null; save(); toast('Zmieniono datę startu'); return; }
  if (k === 'activeTopic') { state.settings.activeTopic = Number(v) || 0; state.daily = null; save(); VIEWS[currentView](); return; }
  if (k === 'examScope') { state.settings.examScope = v; save(); drawExam(); return; }
  if (k === 'sessionSize') v = clamp(Math.round(v) || 15, 10, 30);
  if (k === 'newPerDay') v = clamp(Math.round(v) || 0, 0, 30);
  if (k === 'remindTime' && !/^\d{2}:\d{2}$/.test(v)) return;
  state.settings[k] = v;
  if (['sessionSize', 'newPerDay', 'unlockAll'].includes(k) && state.daily && state.daily.completed.length === 0) state.daily = null;
  save();
}

function notify(title, body) {
  try { new Notification(title, { body, tag: 'english90' }); } catch (e) { toast(title + ': ' + body); }
}
function checkReminder() {
  const n = nowFn();
  if (typeof Notification !== 'undefined' && Notification.permission === 'granted' && reminderDue(n)) {
    state.meta.lastNotified = dstr(n); save();
    notify('English 90 — czas na trening', 'Dzisiejsza sesja czeka: 15–20 minut, a seria rośnie. 🔥');
  }
}

/* ---------- start aplikacji ---------- */
function init() {
  state = loadState();
  save();
  applyTheme();
  if (window.matchMedia) {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(() => applyTheme());
  }
  if (hasTTS) speechSynthesis.onvoiceschanged = () => { if (currentView === 'settings' && document.activeElement && document.activeElement.id !== 'voiceSel') VIEWS.settings(); };

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.tagName === 'INPUT' && el.type !== 'checkbox') return;
    if (el.tagName === 'INPUT') return;   // checkboxy obsługuje 'change'
    const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset && el.dataset.set) { setSetting(el); return; }
    if (el.dataset && (el.dataset.act === 'remind-toggle' || el.dataset.act === 'import-file' || el.dataset.act === 'backup-file' || el.dataset.act === 'sync-merge-file')) ACT[el.dataset.act](el, e);
    if (el.id === 'catMonth') { cat.month = el.value; drawCatList(); }
    if (el.id === 'catTopic') { cat.topic = el.value; drawCatList(); }
    if (el.id === 'catStatus') { cat.status = el.value; drawCatList(); }
  });
  document.addEventListener('input', e => { if (e.target.id === 'catQ') { cat.q = e.target.value; drawCatList(); } });
  document.addEventListener('submit', e => {
    if (e.target.id === 'spokenForm') {
      e.preventDefault();
      const inp = $('#spokenInput');
      const c = state.daily && state.daily.queue.length ? cardById(state.daily.queue[0]) : null;
      if (inp && c && inp.value.trim()) evalSpoken(inp.value.trim(), c);
      return;
    }
    if (e.target.id === 'examTypeForm') {
      e.preventDefault();
      const inp = $('#examInput');
      if (inp && !E.answered) submitExamAnswer(inp.value);
      return;
    }
    if (e.target.id === 'wordForm') {
      e.preventDefault();
      const f = e.target;
      const r = importCards(JSON.stringify([{ kind: 'word', month: Number(f.month.value), en: f.en.value, pl: f.pl.value }]));
      if (!r.ok || r.errors.length) return toast(r.error || r.errors[0]);
      toast(r.wUpdated ? 'Zaktualizowano słówko' : 'Dodano słówko'); f.reset(); drawCatList(); return;
    }
    if (e.target.id !== 'cardForm') return;
    e.preventDefault();
    const f = e.target;
    const rec = { id: cat.editing || undefined, month: Number(f.month.value), en: f.en.value, pl: f.pl.value, phrasePl: f.phrasePl.value, note: f.note.value, prompt: f.prompt.value };
    const errs = validateCard(rec);
    if (errs.length) return toast(errs[0]);
    if (!rec.id) rec.id = 'u' + Date.now().toString(36);
    const r = importCards(JSON.stringify([rec]));
    if (!r.ok || r.errors.length) return toast((r.error || r.errors[0]));
    toast(cat.editing ? 'Zapisano zmiany' : 'Dodano kartę'); cat.editing = null; VIEWS.catalog();
  });
  document.addEventListener('keydown', e => {
    if (currentView === 'exam' && E.phase === 'play' && E.qs[E.idx] && !(e.metaKey || e.ctrlKey || e.altKey)) {
      const q = E.qs[E.idx];
      if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName || '')) {
        if (e.key === 'Enter' && E.answered) { e.preventDefault(); ACT.enext(); }
        return;
      }
      if (e.key === 'l' || e.key === 'L') ACT.espeak();
      else if (q.type !== 'type' && !E.answered && '1234'.includes(e.key) && e.key && Number(e.key) <= q.opts.length) submitExamAnswer(q.opts[Number(e.key) - 1]);
      else if ((e.key === 'Enter' || e.key === ' ') && E.answered) { e.preventDefault(); ACT.enext(); }
      return;
    }
    if (currentView === 'vocab' && V.phase === 'play' && V.cur && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName || '') && !(e.metaKey || e.ctrlKey || e.altKey)) {
      const quiz = state.settings.vocabStyle === 'quiz';
      if (e.key === 'l' || e.key === 'L') speakWord();
      else if (quiz && '1234'.includes(e.key) && e.key && Number(e.key) <= V.opts.length) vocabAnswer(Number(e.key) - 1);
      else if (quiz && (e.key === 'Enter' || e.key === ' ') && V.answered !== null) { e.preventDefault(); ACT.vnext(); }
      else if (!quiz && e.key === ' ') { e.preventDefault(); vocabFlip(); }
      else if (!quiz && V.revealed && '123'.includes(e.key) && e.key) vocabRate(['again', 'good', 'easy'][Number(e.key) - 1]);
      return;
    }
    if (currentView !== 'train' || /INPUT|TEXTAREA|SELECT/.test((e.target.tagName || ''))) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!state.daily.queue.length) return;
    if (e.key === ' ' && !T.rev) { e.preventDefault(); reveal(); }
    else if (e.key === 'l' || e.key === 'L') speakSentence();
    else if ((e.key === 'm' || e.key === 'M') && T.rev) toggleMic();
    else if (T.rev && '1234'.includes(e.key) && e.key) rateCard(['again', 'hard', 'good', 'easy'][Number(e.key) - 1]);
  });
  window.addEventListener('hashchange', route);
  window.addEventListener('pagehide', () => { cancelSpeech(); });
  setInterval(checkReminder, 20000);
  checkReminder();
  route();
}
if (hasDOM) init();
</script>
</body>
</html>
